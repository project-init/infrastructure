name: Pull Request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4.2.3
        with:
          install: true
          install_args: opentofu terraform-docs
          experimental: true
          cache: true

      - name: Format
        run: mise format

      - name: Docs
        run: mise docs

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
