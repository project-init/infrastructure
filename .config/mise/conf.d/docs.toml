##@ Generate Docs

[tasks.docs]
description = "Generate README documentation for all infrastructure modules, then format the repository"
# terraform-docs writes unaligned tables; format them so the PR check sees no drift.
depends_post = ["format:misc"]
run = """
set -eu

for module in modules/*/*/; do
    [ -d "$module" ] || continue
    terraform-docs --config .terraform-docs.yml "$module"
done
"""
