[tools]
opentofu = "1.11.4"
awscli = "latest"
terraform-docs = "latest"
"github:project-init/devex" = "0.15.0"

[settings]
experimental = true

[tasks.docs]
description = "Generate README documentation for all infrastructure modules"
run = """
set -eu

for module in modules/*/*/; do
    [ -d "$module" ] || continue
    terraform-docs --config .terraform-docs.yml "$module"
done
"""
