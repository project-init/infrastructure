default_target: jira-project
default_labels: [triaged]
# Label the discovery skill adds only to work items an agent can finish without human help.
# agent_ready_label: agent-ready

targets:
  jira-project:
    provider: jira
    jira:
      base_url: https://project-init.atlassian.net
      project_key: INIT
      hierarchy_fallback: error
      # Issue link type published for depends_on edges. Must already exist in Jira.
      # link_type: Blocks
      kind_mapping:
        initiative: Epic
        feature: Story
        task: Task
        defect: Bug
        research: Task

  github-project:
    provider: github
    github:
      owner: project-init
      repository: infrastructure
      hierarchy_fallback: flatten
      # Optional labels must already exist in the repository.
      # kind_labels:
      #   defect: bug
      #   research: research
